      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HamzaManagement.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HamzaManagement-APK
          path: HamzaManagement.apk
          retention-days: 30
